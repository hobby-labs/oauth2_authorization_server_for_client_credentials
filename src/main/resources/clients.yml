# OAuth2 Client Configurations
clients:
  mobile-app:
    client-id: "client"
    client-secret: "client-secret"
    client-name: "Client Application"
    scopes: ["read"]
    roles: ["CLIENT"]
    access-token-ttl: 15

  web-dashboard:
    client-id: "introspector"
    client-secret: "introspector-secret"
    client-name: "Introspector"
    scopes: ["read"]
    roles: ["INTROSPECTOR"]
    access-token-ttl: 30

  api-service:
    client-id: "administrator"
    client-secret: "administrator-secret"
    client-name: "Administrator"
    scopes: ["read", "write"]
    roles: ["CLIENT", "INTROSPECTOR"]
    access-token-ttl: 60
